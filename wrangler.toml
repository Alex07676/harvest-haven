name = "harvest-haven-web"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
GAME_SERVER_URL = "wss://server.alexswe.dpdns.org/game"
GAME_SERVER_HTTP_URL = "https://server.alexswe.dpdns.org"

[env.preview]
name = "harvest-haven-web-preview"
vars = { GAME_SERVER_URL = "wss://server.alexswe.dpdns.org/game", GAME_SERVER_HTTP_URL = "https://server.alexswe.dpdns.org" }

[env.production]
name = "harvest-haven-web-production"
vars = { GAME_SERVER_URL = "wss://server.alexswe.dpdns.org/game", GAME_SERVER_HTTP_URL = "https://server.alexswe.dpdns.org" }